<style>
@font-face { font-family: "Baloo 2"; src: url("baloo2.ttf") format("truetype"); font-display: swap }
@font-face { font-family: "Nunito"; src: url("nunito.ttf") format("truetype"); font-display: swap }
:root { --bg: #0b0e26; --fg: #f4f6ff; --dim: rgba(225,230,255,.74); --turq: #2fd4c0; --violet: #8b5cf6; --gold: #ffc24a; color-scheme: dark }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none }
#canvas { display: block; width: 100%; height: 100%; outline: none }

/* ---------------- Ladeinszenierung ---------------- */
#loader { position: fixed; inset: 0; z-index: 10; overflow: hidden; font-family: "Nunito", system-ui, -apple-system, sans-serif;
  background: radial-gradient(120% 70% at 50% 12%, #3b2c86 0%, #1c1a55 42%, #0b0e26 78%); transition: opacity .7s ease }

@keyframes float { from { transform: translateY(0) } to { transform: translateY(-120vh) } }

#tree .root { animation: rootglow 3.2s ease-in-out infinite }
@keyframes rootglow { 50% { opacity: .35 } }
.crystal { z-index: 1; position: absolute; bottom: 22.5%; width: 34px; height: 70px; clip-path: polygon(50% 0, 100% 30%, 82% 100%, 18% 100%, 0 30%);
  background: linear-gradient(160deg, #e9e2ff 0%, #a98bff 35%, #6b3fe0 70%, #3a2390 100%); filter: drop-shadow(0 0 12px rgba(160,120,255,.85)); animation: pulse 2.8s ease-in-out infinite }
.crystal.t { background: linear-gradient(160deg, #e6fffb 0%, #7ef0df 35%, #22b8a6 70%, #136a74 100%); filter: drop-shadow(0 0 12px rgba(47,212,192,.85)) }
@keyframes pulse { 50% { filter: drop-shadow(0 0 22px rgba(190,160,255,1)); transform: translateY(-3px) } }
#ground { z-index: 0; position: absolute; left: -10%; right: -10%; bottom: 0; height: 24%; background: radial-gradient(60% 90% at 50% 0%, #2b6b5a 0%, #173a45 45%, #0b0e26 100%); border-top-left-radius: 50% 40%; border-top-right-radius: 50% 40% }
#ground::before { content: ""; position: absolute; left: 20%; right: 20%; top: -6px; height: 14px; border-radius: 50%; background: radial-gradient(closest-side, rgba(126,240,223,.65), rgba(126,240,223,0)) }
#cast { z-index: 2; position: absolute; left: 0; right: 0; bottom: 19%; display: flex; justify-content: center; align-items: flex-end; gap: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
#cast img { display: block; height: auto; filter: drop-shadow(0 12px 14px rgba(0,0,0,.45)); transform-origin: 50% 100% }
#cast .moosling { width: 27vw; max-width: 160px; animation: hop 2.2s ease-in-out infinite }
#cast .grumrok { width: 36vw; max-width: 210px; margin: 0 -3vw; animation: breathe 3.6s ease-in-out infinite }
#cast .nibbit { width: 25vw; max-width: 150px; animation: wiggle 2.8s ease-in-out infinite }
#cast .lead { order: 0 }
@keyframes hop { 0%, 60%, 100% { transform: translateY(0) scale(1, 1) } 70% { transform: translateY(0) scale(1.06, .92) } 80% { transform: translateY(-18px) scale(.96, 1.05) } 90% { transform: translateY(0) scale(1.04, .95) } }
@keyframes breathe { 50% { transform: scale(1.025, 1.035) } }
@keyframes wiggle { 0%, 100% { transform: rotate(0) } 20% { transform: rotate(-3deg) } 30% { transform: rotate(2deg) } 40% { transform: rotate(0) } }
#top { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 9vh); text-align: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
#top h1 { margin: 0; font: 800 clamp(44px, 13vw, 76px)/1 "Baloo 2", system-ui, sans-serif; letter-spacing: .01em;
  background: linear-gradient(180deg, #fff7d6 0%, #ffd56a 45%, #f0a630 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #7a3c08) drop-shadow(0 10px 18px rgba(0,0,0,.45)) }
#top p { margin: 6px 0 0; font: 700 15px/1.3 "Nunito", system-ui, sans-serif; color: var(--dim); letter-spacing: .12em; text-transform: uppercase }
#bottom { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 3.5vh); display: grid; gap: 12px; justify-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
#bar { position: relative; width: min(320px, 78vw); height: 16px; border-radius: 10px; background: rgba(8,10,40,.75); box-shadow: inset 0 0 0 1.5px rgba(150,170,255,.35), 0 6px 16px rgba(0,0,0,.35); overflow: hidden }
#fill { position: absolute; inset: 2px auto 2px 2px; width: 0; border-radius: 8px; background: linear-gradient(90deg, #22b8a6, #7ef0df 55%, #b49bff); box-shadow: 0 0 14px rgba(126,240,223,.8); transition: width .25s ease }
#fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%); animation: shine 1.6s linear infinite }
@keyframes shine { from { transform: translateX(-100%) } to { transform: translateX(100%) } }
#state { font: 700 14px/1.2 "Nunito", system-ui, sans-serif; color: var(--dim); font-variant-numeric: tabular-nums }
#tip { min-height: 2.8em; max-width: 34ch; text-align: center; font: 600 16px/1.4 "Nunito", system-ui, sans-serif; color: #e9ecff; transition: opacity .35s }
#tip b { color: var(--turq); font-weight: 800 }
#note { color: #ffd2cb; font: 700 15px/1.4 system-ui, sans-serif; max-width: 34ch; text-align: center }
#loader.problem #cast, #loader.problem #tip, #loader.problem .crystal { display: none }
#loader.problem #note { background: rgba(11,14,38,.92); border: 1.5px solid rgba(255,194,74,.55); border-radius: 18px; padding: 16px 18px; max-height: 60vh; overflow: auto }
#loader.problem #note b { display: block; color: #ffc24a; font-size: 17px }
@media (prefers-reduced-motion: reduce) { .mote, #cast img, .crystal, #fill::after, #tree .root { animation: none } }

<script>
// Ladeinszenierung: echte Fortschrittsanzeige (onProgress der Engine), keine künstliche Wartezeit.
(function () {
  const sky = document.getElementById('sky');
  for (let i = 0; i < 26; i++) {
    const m = document.createElement('span'); m.className = 'mote';
    const s = 3 + Math.random() * 6; m.style.width = m.style.height = s + 'px';
    m.style.left = (Math.random() * 100) + '%'; m.style.top = (60 + Math.random() * 60) + '%';
    m.style.animationDuration = (9 + Math.random() * 12) + 's'; m.style.animationDelay = (-Math.random() * 20) + 's';
    m.style.opacity = .35 + Math.random() * .5; sky.appendChild(m);
  }
  // Aktiver Begleiter (vom Spiel gespiegelt) steht in der Mitte und wird begrüßt.
  let comp = null;
  try { comp = JSON.parse(localStorage.getItem('mobbmobs_companion') || 'null'); } catch (e) {}
  const NAMES = { moosling: 'Moosling', grumrok: 'Grumrok', nibbit: 'Nibbit' };
  if (comp && NAMES[comp.species]) {
    const cast = document.getElementById('cast'), lead = cast.querySelector('.' + comp.species);
    const imgs = Array.from(cast.children).filter(x => x !== lead);
    cast.innerHTML = ''; cast.append(imgs[0], lead, imgs[1]); lead.style.zIndex = 2;
    document.getElementById('sub').textContent = (comp.name || NAMES[comp.species]) + ' wartet schon auf dich';
  }
  const TIPS = [
    'Jeder Mobbmob hat genau <b>zwei Persönlichkeitsmerkmale</b>.',
    'Wie gut sich zwei Mobbmobs verstehen, hängt von ihren <b>Persönlichkeiten</b> ab.',
    'Im Labyrinth steuerst du deinen Begleiter nur durch <b>Neigen</b> des Smartphones.',
    'Mobbmobs können sich <b>weiterentwickeln</b> – dafür sammelst du Entwicklungsteile.',
    'Kristalle leuchten wie der <b>Weltbaum</b>.',
    'Manche Wege im Weltbaum öffnen sich nur <b>gemeinsam</b>.',
    'Deinen <b>Begleiter</b> wählst du im Mobbodex unter „Meine Mobbmobs“.'
  ];
  const tip = document.getElementById('tip'); let ti = Math.floor(Math.random() * TIPS.length);
  function nextTip() { tip.style.opacity = 0; setTimeout(() => { tip.innerHTML = TIPS[ti++ % TIPS.length]; tip.style.opacity = 1; }, 350); }
  nextTip(); window.__tipTimer = setInterval(nextTip, 4200);
})();
</script>
<script>
// Godot fordert index.wasm und index.pck an; ausgeliefert werden komprimierte Fassungen.
(function () {
  const realFetch = window.fetch.bind(window);
  const map = { 'index.wasm': ['engine.gz.wasm', 'application/wasm'], 'index.pck': ['data.gz.wasm', 'application/octet-stream'] };
  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    for (const k in map) {
      if (url.split('?')[0].endsWith(k)) {
        // ?v=<Build>: jede Veröffentlichung hat eigene Adressen, damit Safari nie alte (oder halb geladene)
        // Spieldateien aus dem Zwischenspeicher mit einer neuen Seite mischt.
        startLog('Lade ' + map[k][0]);
        return realFetch(map[k][0] + '?v=72eb68a9eb', { cache: 'no-cache' }).then(function (r) {
          if (!r.ok) throw new Error('Datei fehlt: ' + map[k][0] + ' (HTTP ' + r.status + ')');
          return new Response(r.body.pipeThrough(new DecompressionStream('gzip')), { status: 200, headers: { 'Content-Type': map[k][1] } });
        });
      }
    }
    return realFetch(input, init);
  };
})();
</script>
<script>
// ---------------- Startprotokoll und Absicherung des Spielstand-Speichers ----------------
// Ursache des Start-Hängers (iPhone-Test 12.11.2026): Godot öffnet beim Start die IndexedDB des Browsers (dort liegt
// user://, also der Spielstand) und wartet ohne Zeitlimit auf die Antwort. iOS-Safari beantwortet diese Anfrage nach
// dem Zurückkehren aus dem Hintergrund manchmal nie (bekannter WebKit-Fehler: Verbindung zum IndexedDB-Server verloren)
// – der Ladebildschirm blieb dann für immer bei „Die Insel erwacht …“ stehen.
// Abhilfe: Jede Öffnungsanfrage bekommt ein Zeitlimit und wird mehrfach neu gestellt; antwortet der Speicher gar nicht,
// startet das Spiel NICHT ohne Spielstand (sonst sähe es so aus, als wäre er weg), sondern zeigt einen Hinweis mit
// „Neu laden“. Der gespeicherte Stand wird dabei nie verändert oder gelöscht.
window.__startLog = [];
window.startLog = function (msg) {
  const t = (performance.now() / 1000).toFixed(1);
  window.__startLog.push(t + ' s  ' + msg);
  console.log('[Start] ' + msg);
};
startLog('Seite geladen (' + navigator.userAgent.replace(/^.*?\(([^)]*)\).*$/, '$1') + ')');
window.showStartProblem = function (title, text) {
  document.getElementById('loader').classList.add('problem');
  const note = document.getElementById('note');
  note.hidden = false;
  note.innerHTML = '';
  const b = document.createElement('b'); b.textContent = title; note.appendChild(b);
  const p = document.createElement('div'); p.textContent = text; p.style.marginTop = '6px'; note.appendChild(p);
  const btn = document.createElement('button'); btn.textContent = 'Neu laden';
  btn.style.cssText = 'margin-top:12px;font:800 17px "Nunito",system-ui,sans-serif;padding:12px 26px;border:0;border-radius:14px;background:#ffc24a;color:#3a1d00';
  btn.onclick = function () { location.reload(); };
  note.appendChild(btn);
  const log = document.createElement('details'); log.style.cssText = 'margin-top:10px;text-align:left;color:#cfd5ff;font:12px/1.4 ui-monospace,monospace';
  const sum = document.createElement('summary'); sum.textContent = 'Startprotokoll'; log.appendChild(sum);
  const pre = document.createElement('pre'); pre.style.whiteSpace = 'pre-wrap'; pre.textContent = window.__startLog.join('\n'); log.appendChild(pre);
  note.appendChild(log);
};
(function () {
  if (typeof indexedDB === 'undefined') return;
  const realOpen = indexedDB.open.bind(indexedDB);
  const TRY_MS = 2500, TRIES = 4;
  indexedDB.open = function (name, version) {
    // Stellvertreter-Anfrage: Godot (Emscripten IDBFS) setzt onsuccess/onerror/onupgradeneeded darauf.
    const fake = { result: undefined, error: null, transaction: null, readyState: 'pending', onsuccess: null, onerror: null, onupgradeneeded: null, onblocked: null };
    let attempt = 0, done = false, timer = null;
    function ev(target) { return { target: target, preventDefault: function () {}, stopPropagation: function () {} }; }
    function tryOpen() {
      attempt++;
      const mine = attempt;
      startLog('Spielstand-Speicher öffnen (' + name + ', Versuch ' + mine + ')');
      let req;
      try { req = version === undefined ? realOpen(name) : realOpen(name, version); }
      catch (e) { done = true; fake.error = e; fake.readyState = 'done'; if (fake.onerror) fake.onerror(ev(fake)); return; }
      req.onupgradeneeded = function (e) {
        if (done) return;
        fake.result = req.result; fake.transaction = req.transaction;
        startLog('Spielstand-Speicher wird eingerichtet');
        if (fake.onupgradeneeded) fake.onupgradeneeded(ev(fake));
      };
      req.onsuccess = function () {
        if (done) { try { req.result.close(); } catch (e) {} return; }   // verspätete Antwort eines älteren Versuchs
        done = true; clearTimeout(timer);
        fake.result = req.result; fake.readyState = 'done';
        startLog('Spielstand-Speicher bereit (Versuch ' + mine + ')');
        if (fake.onsuccess) fake.onsuccess(ev(fake));
      };
      req.onerror = function (e) {
        if (done) return;
        done = true; clearTimeout(timer);
        fake.error = req.error; fake.readyState = 'done';
        startLog('Spielstand-Speicher Fehler: ' + (req.error && req.error.message));
        if (e && e.preventDefault) e.preventDefault();
        if (fake.onerror) fake.onerror(ev(fake));
      };
      req.onblocked = function () { startLog('Spielstand-Speicher blockiert (anderer Tab?)'); };
      timer = setTimeout(function () {
        if (done) return;
        if (attempt < TRIES) { startLog('Spielstand-Speicher antwortet nicht – neuer Versuch'); tryOpen(); return; }
        startLog('Spielstand-Speicher antwortet nicht – Start angehalten');
        window.__storageStuck = true;
        showStartProblem('Der Speicher deines Browsers antwortet gerade nicht.',
          'Dein Spielstand ist nicht verloren. Tippe auf „Neu laden“. Hilft das nicht: Safari ganz schließen ' +
          '(im App-Umschalter nach oben wischen) und die Seite neu öffnen.');
      }, TRY_MS);
    }
    tryOpen();
    return fake;
  };
})();
</script>

<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9247248,"index.wasm":43699190},"focusCanvas":true,"gdextensionLibs":[]};
const engine = new Engine(GODOT_CONFIG);
const fill = document.getElementById('fill'), state = document.getElementById('state'), note = document.getElementById('note'), loader = document.getElementById('loader'), bar = document.getElementById('bar');
const missing = Engine.getMissingFeatures({ threads: false });
if (typeof DecompressionStream === 'undefined') missing.push('DecompressionStream (iOS 16.4 oder neuer)');
if (missing.length) {
  note.hidden = false; note.textContent = 'Nicht unterstützt: ' + missing.join(', ');
} else {
  let loaded = false, started = false;
  // Wächter: Hängt der Start nach dem Laden ungewöhnlich lange, Hinweis mit Startprotokoll und „Neu laden“ zeigen
  // (nichts wird gelöscht). Der Start läuft im Hintergrund weiter; gelingt er noch, verschwindet der Hinweis.
  const watchdog = setInterval(function () {
    if (started || window.__storageStuck) { clearInterval(watchdog); return; }
    if (loaded && performance.now() - loaded > 45000) {
      clearInterval(watchdog);
      startLog('Start dauert ungewöhnlich lange');
      showStartProblem('Der Start dauert ungewöhnlich lange.', 'Dein Spielstand ist nicht verloren. Tippe auf „Neu laden“.');
    }
  }, 1000);
  startLog('Build 72eb68a9eb');
  engine.startGame({
    onProgress: function (cur, total) {
      if (total > 0) {
        const p = Math.min(100, Math.round(cur / total * 100));
        fill.style.width = 'calc(' + p + '% - 4px)'; bar.setAttribute('aria-valuenow', p);
        state.textContent = p < 100 ? 'Lädt die Insel … ' + p + ' %' : 'Die Insel erwacht …';
        if (p >= 100 && !loaded) { loaded = performance.now(); startLog('Spieldateien geladen'); }
      }
    },
  }).then(function () {
    started = true; startLog('Spiel gestartet');
    note.hidden = true; loader.classList.remove('problem');
    loader.classList.add('done'); clearInterval(window.__tipTimer);
    setTimeout(function () { loader.remove(); }, 800);
  }, function (err) {
    startLog('Start fehlgeschlagen: ' + (err && err.message ? err.message : err)); console.error(err);
    showStartProblem('Start fehlgeschlagen', String(err && err.message ? err.message : err));
  });
}
</script>
